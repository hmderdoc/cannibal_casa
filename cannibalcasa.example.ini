; ============================================================================
;  Cannibal Casa - door configuration
;  install-xtrn copies this file to "cannibalcasa.ini" next to the binary. The
;  door reads it at launch, so the next caller picks up changes, no BBS restart.
; ============================================================================

[settings]
; Where per-player saves, the neighborhood feed and mail live when the door runs
; in LOCAL mode (no server below). Every node on this BBS shares one cul-de-sac
; through this directory. Default: the SBBSDATA env var + /cannibalcasa, or
; ./data next to the binary when the BBS doesn't export SBBSDATA.
; data_dir = /sbbs/data/cannibalcasa

; In-game days a caller may advance per real day, and the ceiling those days
; accrue to while they're away (catch-up). Decision: a few days per real day.
days_per_day = 3
day_bank_max = 9

; Output color depth for new callers (each caller can change it in OPTIONS):
;   16 (default, every terminal) | 256
color_mode = 16

; Character set. Doors on a BBS speak CP437 (default); use utf8 only for a
; local terminal that can't do CP437.
; charset = cp437

; ----------------------------------------------------------------------------
;  Neighborhood server (optional) - cross-BBS cul-de-sac.
;  Leave "server" blank to run a LOCAL neighborhood (all nodes on this BBS).
;  Set it to share one street with other boards; the token must match the
;  server's -token. Keep this file local: the token is a shared secret.
; ----------------------------------------------------------------------------
[server]
; server = 127.0.0.1
; port   = 7710
; token  = CHANGE_ME
; bbsname = my.bbs.example
