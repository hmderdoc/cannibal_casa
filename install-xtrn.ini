Name: Cannibal Casa
Desc: Suburban cannibal home-builder. Feed yourself, expand the house, hide the evidence, mind the HOA.
By:   HM Derdok
Cats: Games
Subs: Strategy, Simulation, Multiplayer

[prog:CANNIBAL]
cmd  = cannibalcasa -dropfile %f
type = XTRN_DOOR32
settings = XTRN_NATIVE | XTRN_MULTIUSER
execution_ars = ANSI AND COLS 80 AND ROWS 24
required = true
note = Build the binary first: "go build ./cmd/cannibalcasa" in this directory (or drop a release binary here).

[copy:cannibalcasa.example.ini]
dest = cannibalcasa.ini
